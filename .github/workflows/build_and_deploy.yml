name: build and deploy to firebase

on:
    push:
        branches:
            - release

permissions:
    checks: write
    contents: read
    pull-requests: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repository and submodules
              uses: actions/checkout@v5
              with:
                  submodules: true

            - name: setup node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24

            - name: print versions
              run: |
                  node -v
                  npm -v

            - name: install dependencies
              run: npm ci

            - name: run checks
              run: npm run check

            - name: build website
              run: npm run build

            - name: deploy to firebase
              uses: FirebaseExtended/action-hosting-deploy@v0
              with:
                  repoToken: ${{ secrets.GITHUB_TOKEN }}
                  firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHESSTER_F3798 }}
                  projectId: chesster-f3798
                  channelId: live
